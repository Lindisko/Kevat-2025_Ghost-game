<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="intro-screen">
        <h1>Välkommen till Ghost Game...</h1>
        <p>Skjut spökena för att komma till näst nivå...</p>
        <h2>Spökena:</h2>
        <div>
            <img src="images/Ghost.png">
            <div>
                <h3>Molgan...</h3>
                <p>Rör sig hela tiden mot spelaren...</p>
            </div>
        </div>
        <div>
            <button id="new-game-btn">Starta spelet</button>
        </div>
    </div>
    <div id="game-screen">
        <div id="game-board"></div>
    </div>

    <div id="score-board"></div>
</body>
</html>
